version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      astro:
        patterns: ["astro", "@astrojs/*"]
    ignore:
      # @astrojs/check (run by `npm run build`) supports TypeScript ^5 || ^6 only.
      # Remove once it accepts TypeScript 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
